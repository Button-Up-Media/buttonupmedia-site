<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="'Plus Jakarta Sans','Figtree',system-ui,sans-serif" role="img" aria-label="A Google Business Profile card for a restaurant, showing photos, name, star rating, open hours, and Directions, Call, Website and Save buttons, with a banner noting the owner manages this profile.">
  <defs>
    <filter id="gbp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#120e08" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="gbp-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2A84D"/><stop offset="1" stop-color="#D06A50"/>
    </linearGradient>
    <clipPath id="gbp-panel"><rect x="56" y="40" width="1088" height="780" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="860" fill="#f4efe5"/>
  <rect x="56" y="40" width="1088" height="780" rx="26" fill="#ffffff" stroke="rgba(28,24,18,0.10)" filter="url(#gbp-shadow)"/>

  <!-- cover band with photo thumbnails -->
  <g clip-path="url(#gbp-panel)">
    <rect x="56" y="40" width="1088" height="172" fill="url(#gbp-cover)"/>
    <g opacity="0.92">
      <rect x="760" y="70" width="112" height="112" rx="10" fill="#ffffff" opacity="0.22"/>
      <rect x="884" y="70" width="112" height="112" rx="10" fill="#ffffff" opacity="0.16"/>
      <rect x="1008" y="70" width="112" height="112" rx="10" fill="#ffffff" opacity="0.10"/>
    </g>
    <circle cx="120" cy="98" r="20" fill="#ffffff" opacity="0.9"/>
    <path d="M111 100 a9 9 0 1 1 18 0 a9 9 0 0 1 -18 0 z" fill="#D06A50"/>
    <rect x="113" y="86" width="14" height="7" rx="2" fill="#ffffff"/>
    <text x="152" y="104" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">PHOTOS</text>
  </g>

  <!-- name + rating -->
  <text x="96" y="280" font-size="42" font-weight="800" fill="#120e08">Casa Maria Cuban Kitchen</text>
  <text x="96" y="330" font-size="26" font-weight="700" fill="#3a352c">4.8</text>
  <g transform="translate(146,310)" fill="#E2A84D"><path d="M12 0l3.2 7.5 8 .6-6 5.2 1.9 8L12 24l-7 4.3 1.9-8-6-5.2 8-.6z"/><g transform="translate(31,0)"><path d="M12 0l3.2 7.5 8 .6-6 5.2 1.9 8L12 24l-7 4.3 1.9-8-6-5.2 8-.6z"/></g><g transform="translate(62,0)"><path d="M12 0l3.2 7.5 8 .6-6 5.2 1.9 8L12 24l-7 4.3 1.9-8-6-5.2 8-.6z"/></g><g transform="translate(93,0)"><path d="M12 0l3.2 7.5 8 .6-6 5.2 1.9 8L12 24l-7 4.3 1.9-8-6-5.2 8-.6z"/></g><g transform="translate(124,0)"><path d="M12 0l3.2 7.5 8 .6-6 5.2 1.9 8L12 24l-7 4.3 1.9-8-6-5.2 8-.6z"/></g></g>
  <text x="290" y="330" font-size="24" fill="#8a8474">(412 reviews)  ·  $$  ·  Cuban restaurant</text>
  <text x="96" y="372" font-size="24" font-weight="700" fill="#1e7d4f">Open</text>
  <text x="176" y="372" font-size="24" fill="#8a8474">·  Closes 10 PM  ·  Little Havana, Miami</text>

  <!-- action buttons -->
  <g transform="translate(96,406)">
    <rect x="0" y="0" width="184" height="58" rx="29" fill="#E2A84D"/>
    <path d="M30 14 l16 15 -7 0 0 14 -18 0 0-14 -7 0 z" fill="#1c1407" transform="rotate(45 32 29)"/>
    <text x="74" y="37" font-size="22" font-weight="700" fill="#1c1407">Directions</text>
    <rect x="204" y="0" width="150" height="58" rx="29" fill="#ffffff" stroke="rgba(28,24,18,0.18)"/>
    <path transform="translate(222,15) scale(1.18)" d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1l-2.3 2.2z" fill="#9a6410"/>
    <text x="266" y="37" font-size="22" font-weight="700" fill="#241f18">Call</text>
    <rect x="378" y="0" width="178" height="58" rx="29" fill="#ffffff" stroke="rgba(28,24,18,0.18)"/>
    <circle cx="408" cy="29" r="13" fill="none" stroke="#9a6410" stroke-width="3"/>
    <path d="M395 29 h26 M408 16 q9 13 0 26 q-9-13 0-26" fill="none" stroke="#9a6410" stroke-width="2.5"/>
    <text x="430" y="37" font-size="22" font-weight="700" fill="#241f18">Website</text>
    <rect x="580" y="0" width="150" height="58" rx="29" fill="#ffffff" stroke="rgba(28,24,18,0.18)"/>
    <path d="M610 14 a6 6 0 0 1 12 4 c0 7 -12 14 -12 14 c0 0 -12-7 -12-14 a6 6 0 0 1 12-4 z" fill="none" stroke="#9a6410" stroke-width="2.5" transform="translate(-4,0)"/>
    <text x="636" y="37" font-size="22" font-weight="700" fill="#241f18">Save</text>
  </g>

  <line x1="96" y1="506" x2="1104" y2="506" stroke="rgba(28,24,18,0.10)"/>

  <!-- info rows -->
  <g font-size="23" fill="#3a352c">
    <g transform="translate(96,540)">
      <path d="M16 0 a16 16 0 0 1 16 16 c0 12 -16 26 -16 26 c0 0 -16-14 -16-26 a16 16 0 0 1 16-16 z" fill="none" stroke="#E2A84D" stroke-width="3"/><circle cx="16" cy="16" r="6" fill="#E2A84D"/>
      <text x="56" y="32">1421 SW 8th St, Miami, FL 33135</text>
    </g>
    <g transform="translate(96,602)">
      <circle cx="16" cy="20" r="17" fill="none" stroke="#E2A84D" stroke-width="3"/><path d="M16 9 v12 l9 5" fill="none" stroke="#E2A84D" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="30">Mon–Sun  ·  11 AM – 10 PM</text>
    </g>
    <g transform="translate(96,664)">
      <path transform="scale(1.5)" d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1l-2.3 2.2z" fill="#E2A84D"/>
      <text x="56" y="30">(786) 555-0142</text>
    </g>
    <g transform="translate(96,726)">
      <rect x="2" y="4" width="32" height="32" rx="6" fill="none" stroke="#E2A84D" stroke-width="3"/><path d="M2 16 h32 M10 4 v32" stroke="#E2A84D" stroke-width="2.5"/>
      <text x="56" y="30">View menu  ·  casamariakitchen.com</text>
    </g>
  </g>

  <!-- owner banner -->
  <g transform="translate(660,540)">
    <rect x="0" y="0" width="404" height="206" rx="16" fill="#faf0dd" stroke="rgba(226,168,77,0.4)"/>
    <circle cx="44" cy="48" r="22" fill="#E2A84D"/>
    <path d="M34 48 l7 8 13-15" fill="none" stroke="#1c1407" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="44" font-size="22" font-weight="800" fill="#241f18">You manage this</text>
    <text x="80" y="74" font-size="22" font-weight="800" fill="#241f18">Business Profile</text>
    <text x="28" y="120" font-size="20" fill="#5b5446">Free from Google. Every field you</text>
    <text x="28" y="148" font-size="20" fill="#5b5446">fill in is a reason for Google to</text>
    <text x="28" y="176" font-size="20" fill="#5b5446">show you in the map.</text>
  </g>
</svg>
