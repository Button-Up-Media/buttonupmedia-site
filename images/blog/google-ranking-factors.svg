<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Plus Jakarta Sans','Figtree',system-ui,sans-serif" role="img" aria-label="The three things Google grades for the local map: relevance and prominence, which you control, and distance, which is set by your location.">
  <defs>
    <filter id="rf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#120e08" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#f4efe5"/>
  <text x="600" y="58" font-size="20" font-weight="800" letter-spacing="3" fill="#9a6410" text-anchor="middle">WHAT GOOGLE GRADES FOR THE MAP</text>

  <!-- Card 1: Relevance -->
  <g>
    <rect x="60" y="96" width="341" height="396" rx="22" fill="#ffffff" stroke="rgba(28,24,18,0.10)" filter="url(#rf-shadow)"/>
    <circle cx="230" cy="186" r="46" fill="#faf0dd"/>
    <circle cx="230" cy="186" r="26" fill="none" stroke="#E2A84D" stroke-width="4"/>
    <circle cx="230" cy="186" r="9" fill="#E2A84D"/>
    <line x1="230" y1="146" x2="230" y2="162" stroke="#E2A84D" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="230" y2="226" stroke="#E2A84D" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="186" x2="206" y2="186" stroke="#E2A84D" stroke-width="4" stroke-linecap="round"/>
    <line x1="254" y1="186" x2="270" y2="186" stroke="#E2A84D" stroke-width="4" stroke-linecap="round"/>
    <text x="230" y="296" font-size="32" font-weight="800" fill="#120e08" text-anchor="middle">Relevance</text>
    <text x="230" y="338" font-size="21" fill="#5b5446" text-anchor="middle">How well your profile</text>
    <text x="230" y="366" font-size="21" fill="#5b5446" text-anchor="middle">matches what they typed.</text>
    <rect x="128" y="416" width="204" height="42" rx="21" fill="#e6f4ec"/>
    <path d="M150 437 l7 7 13-15" fill="none" stroke="#1e7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="186" y="443" font-size="19" font-weight="800" fill="#1e7d4f">You control it</text>
  </g>

  <!-- Card 2: Distance -->
  <g>
    <rect x="429" y="96" width="341" height="396" rx="22" fill="#ffffff" stroke="rgba(28,24,18,0.10)" filter="url(#rf-shadow)"/>
    <circle cx="599" cy="186" r="46" fill="#eeeae1"/>
    <path d="M599 150 a26 26 0 0 1 26 26 c0 20 -26 44 -26 44 c0 0 -26-24 -26-44 a26 26 0 0 1 26-26 z" fill="none" stroke="#8a8474" stroke-width="4"/>
    <circle cx="599" cy="176" r="10" fill="#8a8474"/>
    <text x="599" y="296" font-size="32" font-weight="800" fill="#120e08" text-anchor="middle">Distance</text>
    <text x="599" y="338" font-size="21" fill="#5b5446" text-anchor="middle">How close you are to</text>
    <text x="599" y="366" font-size="21" fill="#5b5446" text-anchor="middle">the person searching.</text>
    <rect x="471" y="416" width="258" height="42" rx="21" fill="#eeeae1"/>
    <text x="600" y="443" font-size="19" font-weight="800" fill="#6b6453" text-anchor="middle">Set by your location</text>
  </g>

  <!-- Card 3: Prominence -->
  <g>
    <rect x="798" y="96" width="341" height="396" rx="22" fill="#ffffff" stroke="rgba(28,24,18,0.10)" filter="url(#rf-shadow)"/>
    <circle cx="968" cy="186" r="46" fill="#faf0dd"/>
    <path d="M968 152l8.4 17 18.6 2.4-13.8 12.8 3.6 18.6L968 211l-16.8 9.8 3.6-18.6L941 189.4l18.6-2.4z" fill="#E2A84D"/>
    <text x="968" y="296" font-size="32" font-weight="800" fill="#120e08" text-anchor="middle">Prominence</text>
    <text x="968" y="338" font-size="21" fill="#5b5446" text-anchor="middle">How trusted and</text>
    <text x="968" y="366" font-size="21" fill="#5b5446" text-anchor="middle">reviewed you look.</text>
    <rect x="866" y="416" width="204" height="42" rx="21" fill="#e6f4ec"/>
    <path d="M888 437 l7 7 13-15" fill="none" stroke="#1e7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="924" y="443" font-size="19" font-weight="800" fill="#1e7d4f">You control it</text>
  </g>
</svg>
